[project]
name = "fico-mcp"
version = "0.1.0"
description = "FastMCP server exposing the full FiCo FL-NTOE HTTP surface to agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.12.0",
  "httpx>=0.28.0",
]

[project.scripts]
fico-mcp = "fico_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fico_mcp"]

[tool.uv]
package = true
