services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: fico
      POSTGRES_PASSWORD: fico
      POSTGRES_DB: fico
    ports:
      - "5433:5432"
    volumes:
      - fico_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fico -d fico"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - fico_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for the document vault (PDF upload).
  # The MinIO images were removed from Docker Hub and quay.io, so the stack uses
  # adobe/s3mock: port 9090 in the container, 9000 on the host (matches
  # S3_ENDPOINT=http://localhost:9000), CORS answered with "*" for the browser.
  s3:
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_S3MOCK_STORE_REGION: eu-central-1
    ports:
      - "9000:9090"
    volumes:
      - fico_s3:/data

  # One-shot: creates the bucket from S3_BUCKET (default fico-documents).
  s3-init:
    image: curlimages/curl:8.10.1
    depends_on:
      - s3
    environment:
      S3_BUCKET: ${S3_BUCKET:-fico-documents}
    entrypoint: ["sh", "/init-bucket.sh"]
    volumes:
      - ./infra/init-bucket.sh:/init-bucket.sh:ro
    restart: "no"

volumes:
  fico_pg:
  fico_redis:
  fico_s3:
