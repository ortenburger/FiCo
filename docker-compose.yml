services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: fico
      POSTGRES_PASSWORD: fico
      POSTGRES_DB: fico
    ports:
      - "5433:5432"
    volumes:
      - fico_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fico -d fico"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - fico_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO was pulled from the Docker Hub repository, so the image tag below is
  # no longer resolvable there. The object-storage path (document upload) needs
  # a reachable image before it can be started; the voice intake does not.
  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - fico_minio:/data
    profiles: ["storage"]

volumes:
  fico_pg:
  fico_redis:
  fico_minio:
